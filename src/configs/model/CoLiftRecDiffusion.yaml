model: CoLiftRecDiffusion

backbone:
  model: MSCA
  seed: 1000

common:
  top_l: 100
  attribute:
    tfidf_min_df: 2
    tfidf_max_df: 0.8
    description_len: 128
    weights:
      title: 0.45
      brand: 0.20
      description: 0.35
  diffusion:
    method: preference_directed_boundary_refinement
    lambda_hn: 0.20
    half_margin: 0.25
    theta_max_deg: 5.0
    local_t: [1, 2, 3, 4, 5]
    warmup_epochs: 10
    max_epochs: 60
    early_stopping: inherit_msca
    active_steps: 2
    inference_enabled: false
    checkpoint_selection: best_full_coliftrec_validation_r20
    optimizer:
      name: Adam
      lr: 0.001
    network:
      hidden: 256
      dropout: 0.1
    bands:
      - [60, 100]
      - [30, 60]
      - [10, 30]

datasets:
  baby:
    coliftrec:
      text: {enabled: true, lambda: 1.0, alpha: 0.25}
      attribute: {enabled: true, lambda: 0.75, alpha: 0.15}
      visual: {enabled: true, lambda: 0.25, alpha: 0.025}
  sports:
    coliftrec:
      text: {enabled: true, lambda: 0.0, alpha: 0.25}
      attribute: {enabled: true, lambda: 1.0, alpha: 0.20}
      visual: {enabled: true, lambda: 1.0, alpha: 0.025}
  elec:
    coliftrec:
      text: {enabled: true, lambda: 1.0, alpha: 0.20}
      attribute: {enabled: true, lambda: 1.0, alpha: 0.20}
      visual: {enabled: true, lambda: 0.25, alpha: 0.025}
