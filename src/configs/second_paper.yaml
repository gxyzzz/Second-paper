dataset: baby
seed: 999

coliftrec:
  enabled: true
  top_l: 100
  text:
    enabled: true
    lambda: 1.0
    alpha: 0.25
  attribute:
    enabled: true
    lambda: 0.75
    alpha: 0.15
    tfidf_min_df: 2
    tfidf_max_df: 0.8
    description_len: 128
    field_weights:
      title: 0.45
      brand: 0.20
      description: 0.35
  visual:
    enabled: true
    lambda: 0.25
    alpha: 0.025

diffusion:
  enabled: false
  input_dim: 4480
  hidden_dims: [1024, 512, 1024]
  prediction: x0
  schedule: cosine
  diffusion_steps: 50
  time_embedding_dim: 64
  lambda_ctr: 0.1
  p_uncond: 0.15
  optimizer: AdamW
  lr: 0.001
  weight_decay: 0.0001
  beta: null
  t_edit: null
  guidance: null
  rho_text: 0.0
  rho_visual: 0.0
