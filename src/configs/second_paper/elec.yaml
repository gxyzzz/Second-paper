dataset: elec
display_name: Electronics
paths:
  interaction: data/elec/elec.inter
  text_feature: data/elec/text_feat.npy
  visual_feature: data/elec/image_feat.npy
  metadata: data/elec/metadata_text_cache.jsonl
coliftrec:
  top_l: 100
  text: {enabled: true, lambda: 1.0, alpha: 0.20}
  attribute:
    enabled: true
    lambda: 1.0
    alpha: 0.20
    tfidf_min_df: 2
    tfidf_max_df: 0.8
    description_len: 128
  visual: {enabled: true, lambda: 0.25, alpha: 0.025}
diffusion:
  beta_candidates: [0.5, 1.0]
  t_edit_candidates: [3, 5, 7]
  guidance_candidates: [1.5, 2.0]
  rho_text_candidates: [0.25, 0.5, 0.75, 1.0]
  rho_visual_candidates: [0.5, 0.75, 1.0]
